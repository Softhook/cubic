# Regolith: its own card decks (docs/regolith/REGOLITH.md §3)
#
# Every card starts as a Community card (`from`) and moves away from it: `status` says how far.
#   community — the copy: same name and action as the Community card
#   renamed   — new name and words, same action (`effect` is still the Community card's)
#   reworked  — action changed: an `effect` of its own
#   new       — no Community ancestor (no `from`)
# Text is in Regolith's words (REGOLITH-WORLD.md, *The words*). Ingenious is left out: hexes have no corners.
# `art` is the brief its screenprint card is drawn from (§5); until then it shows the `from` card's picture.
# Names and art were picked on the Regolith Card Picks page from docs/regolith/card-ideas.yaml (23 October 2026).
# build-data.mjs builds this into packages/engine/src/regolith/cards.json.

