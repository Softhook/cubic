    name: Black Market
    subtitle: "Gain missiles"
    text: "Gain 2 Missiles."
    ce_status: playtesting
    count: 2
    notes: "stolksdorf name: Black Market Cache. Its yaml says 1 missile, Cards.md and print edition say 2."
  - id: change-of-heart
    name: Change of Heart
    subtitle: "Choose a skill"
    text: "Search the Skill deck and take a card of your choosing, then shuffle the deck."
    ce_status: new
    count: 2
  - id: momentum
    name: Momentum
    subtitle: "Take a bonus turn"
