# Quantum: Community Edition — card data
#
# Baseline text: WaterGoesRed CE print edition (reference/community-edition-print/QCEC-cards-A4.pdf),
# typos fixed. `ce_status` and categories from github.com/stolksdorf/quantum (src/cards/*.yaml):
#   original    — card from the 2013 game, wording unchanged
#   revised     — same mechanics as the original, clearer wording
#   changed     — original card, mechanics changed
#   new         — added by the Community Edition
#   playtesting — added/changed by the CE and still flagged as unbalanced
#   unchanged   — original card kept as-is by the CE
# Rule interpretations for each card live in docs/OPEN-QUESTIONS.md.

