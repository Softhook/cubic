# Quantum map layouts
#
# A map is a grid of tiles. Each tile is 3x3 board spaces with the planet in the centre,
# so a map with R rows x C cols of tiles is a (3R) x (3C) board.
#
# Layout tokens (space-separated, one string per tile row):
#   7 | 8 | 9 | 10   planet tile; number = conquer target and cube locations (7→1, 8→2, 9→3, 10→4)
#   0                void tile: no planet; +1 research per own ship on it at start of turn
#   .                no tile (empty gap, not part of the board)
#   suffix *         starting planet
#
# Stats (from the CE print booklet), all derivable from layout + cubes + player count:
#   slack   = total cube locations − players × cubes
#   planets = planets that still have an empty location after setup
#   shared  = how many of those must be shared if everyone placed all their cubes
# Sources: reference/community-edition-print/QCB-rules-booklet-A5.pdf
#          reference/bga/maps.json (official maps as implemented on Board Game Arena)
#
# The basic maps are the official second-printing versions. The first-printing rulebook
# (reference/original-2013/) shows an older 2p and 3p map; the designer corrected both in
# his errata (BGG thread 1087563).

maps:
  - id: alpha-sector
    name: Alpha Sector
    players: 2
    group: basic
    cubes: 5
    stats: { slack: 0, shared: 1, planets: 7 }
    layout:
      - "7* 7 7"
      - "7  8 7"
      - "7  7 7*"

  - id: beta-sector
    name: Beta Sector
    players: 3
    group: basic
    cubes: 5
    stats: { slack: 4, shared: 4, planets: 8 }
    layout:
      - "8* 9  8*"
      - "8  9  8"
      - "8  7* 8"

  - id: gamma-sector
    name: Gamma Sector
    players: 4
    group: basic
    cubes: 5
    stats: { slack: 3, shared: 6, planets: 9 }
    layout:
      - "8* 9  8*"
      - "8  10 8"
      - "9* 8  9*"

