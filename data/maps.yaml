# Quantum map layouts
#
# A map is a grid of tiles. Each tile is 3x3 board spaces with the planet in the centre,
# so a map with R rows x C cols of tiles is a (3R) x (3C) board.
#
# Layout tokens (space-separated, one string per tile row):
#   7 | 8 | 9 | 10   planet tile; number = conquer target and cube locations (7→1, 8→2, 9→3, 10→4)
#   0                void tile: no planet; +1 research per own ship on it at start of turn
#   -                blank tile: open ground, no planet and no research
#   .                no tile (empty gap, not part of the board)
#   suffix n ne e se s sw w nw
#                    the planet sits off the middle of its tile, on that space (north is up as drawn)
#   suffix *         starting planet, after any direction: 8*, 7ne*
#
# An off-centre planet's orbit is still the spaces next to it, so it reaches onto the tiles it faces,
# loses spaces off the map's edge, and may overlap another planet's: a ship there counts for both. A
# square tile's planet may sit on any of the 8 spaces around the middle; a hex tile's on any of its 6
# outer hexes (n ne se s sw nw). Each starting planet needs 3 orbital spaces no other start shares.
#
# Groups: basic (the box's basic maps), advanced (the 2013 rulebook's advanced maps),
#         addon (the add-on pack), bga (maps Board Game Arena added),
#         ce (the CE print booklet's 5-player maps, pages 14–15),
#         hex (square maps adapted to hex tiles), open (hex maps spread out with blank tiles),
#         drift (planets off the middle of their tiles).
#
# grid (optional): hex. The tiles are 7-hex flowers (the planet and the six spaces around it), so all
#   six spaces of a tile are its planet's orbit. A hex layout is read as rows of tiles where each odd
#   row (the 2nd, 4th…) sits half a tile to the right, between the tiles of the rows above and below:
#   a tile touches the two tiles beside it and two in each neighbouring row (docs/HEX.md). Hex maps
#   don't wrap.
#
# world (optional, hex maps only): phobos | mars. The surface the map lies on, which its tiles show; Mars
#   when absent.
#
# wrap (optional): horizontal | vertical | both. The booklet marks these edges with arrows.
#   A ship leaving one edge comes back at the opposite edge of the same row or column, as if
#   the board were a cylinder (or a torus for both). The join is on the full grid, so a row or
#   column only wraps when it has a tile at both ends.
#
# Stats (from the CE print booklet), all derivable from layout + cubes + player count:
#   slack   = total cube locations − players × cubes
#   planets = planets that still have an empty location after setup
#   shared  = how many of those must be shared if everyone placed all their cubes
# Sources: reference/community-edition-print/QCB-rules-booklet-A5.pdf
#          reference/bga/maps.json (official maps as implemented on Board Game Arena)
#
# The basic maps are the official second-printing versions. The first-printing rulebook
# (reference/original-2013/) shows an older 2p and 3p map; the designer corrected both in
# his errata (BGG thread 1087563).
#
# The 2–4 player advanced, addon and bga maps come from reference/bga/maps.json; the ce maps
# from the booklet. Their stats were computed by mapStats() rather than copied from the booklet;
# maps.test.ts keeps them in step with the layouts.

maps:
  - id: alpha-sector
    name: Alpha Sector
    players: 2
    group: basic
    cubes: 5
    stats: { slack: 0, shared: 1, planets: 7 }
    layout:
      - "7* 7 7"
      - "7  8 7"
      - "7  7 7*"

  - id: beta-sector
    name: Beta Sector
    players: 3
    group: basic
    cubes: 5
    stats: { slack: 4, shared: 4, planets: 8 }
    layout:
      - "8* 9  8*"
      - "8  9  8"
      - "8  7* 8"

  - id: gamma-sector
    name: Gamma Sector
    players: 4
    group: basic
    cubes: 5
    stats: { slack: 3, shared: 6, planets: 9 }
    layout:
      - "8* 9  8*"
      - "8  10 8"
      - "9* 8  9*"

  # Hex: the basic maps on hex tiles (docs/HEX.md). A 3×3 square map becomes a 3×3 rhombus of
  # flowers standing on a point (rows 1-2-3-2-1), and the 3-player map a triangle with the 10 in its
  # middle, each start touching one 7 and one 8. Same cubes and planets per player as the square maps.

  - id: alpha-hex
    name: Alpha Sector (hex)
    players: 2
    group: hex
    grid: hex
    world: phobos
    cubes: 5
    stats: { slack: 0, shared: 1, planets: 7 }
    layout:
      - ".  7*"
      - "7  7"
      - "7  8  7"
      - "7  7"
      - ".  7*"

  - id: beta-hex
    name: Beta Sector (hex)
    players: 3
    group: hex
    grid: hex
    cubes: 5
    stats: { slack: 4, shared: 4, planets: 10 }
