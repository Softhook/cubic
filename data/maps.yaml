    stats: { slack: 2, shared: 4, planets: 6 }
    # A ring of eight round a two-tile hole, the starts across it.
    layout:
      - "7* 8  8"
      - "8  .  .  8"
      - "8  8  7*"

  - id: the-great-plan-hex
    name: The Great Plan (hex)
