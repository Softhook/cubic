# Regolith card ideas: names and art briefs to choose from (docs/regolith/REGOLITH.md §3, §5).
#
# Three name candidates and three art briefs for every Community card in Regolith's deck (Ingenious is left
# out: hexes have no corners). `npm run regolith:picks` turns this file into the Regolith Card Picks page,
# where each card can keep its Community name, take a candidate or a name of your own, and pick an art brief.
# Settled names go into data/regolith.yaml when it exists; this file is only the menu.
#
# Names follow the CardStyles board: Skills are crews, kit and habits (Servo Tuning, Hot Loads), Tactics are
# operations (Railgun Strike, Ice Tunnel). Words and setting come from REGOLITH-WORLD.md: mechs, objectives,
# perimeters, claiming, power, research, salvage yard, refit, drop, atomic. No space, no aliens.
#
# Art briefs are for the screenprint renderer (REGOLITH.md §5): three flat inks, bold shapes, one subject
# from the kit (the six mechs, the five objectives, the props) or the crews who work them.

