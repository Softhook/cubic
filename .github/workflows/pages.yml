name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  # Lint, dead code (knip), and the rules' safety net (golden replays, invariants, legality cross-check, card audit): a failure stops the deploy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run circular
      - run: npm run knip
      - run: npm run format:check
      - run: npm test

  # Phone and tablet layouts in emulation (docs/MOBILE.md), and the screens unit tests can't render (ui-check.ts):
  # a failure stops the deploy. Uses the runner's own Google Chrome. When it fails, the screenshots are kept for a
  # week, to see what broke.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mobile:shots
      - run: npm run ui:check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: |
            test-results/mobile
            test-results/ui
          retention-days: 7

  deploy:
    needs: [build, test, layout]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
